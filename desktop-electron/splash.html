<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NAI Studio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: "Segoe UI", "Microsoft YaHei UI", system-ui, -apple-system, sans-serif;
      color: #f1f5f9;
    }
    .card {
      width: 100%;
      height: 100%;
      border-radius: 16px;
      background: radial-gradient(circle at 20% 15%, rgba(99, 102, 241, 0.22), transparent 55%),
                  linear-gradient(145deg, #11141c 0%, #0b0e14 100%);
      border: 1px solid rgba(148, 163, 184, 0.18);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 28px;
      -webkit-app-region: drag;
    }
    .logo {
      width: 68px;
      height: 68px;
      border-radius: 18px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(129, 140, 248, 0.28);
    }
    .title {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #f8fafc;
    }
    .sub {
      font-size: 12px;
      color: #94a3b8;
      margin-top: -8px;
    }
    .bar-wrap {
      width: 220px;
      height: 3px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.16);
      overflow: hidden;
      margin-top: 6px;
    }
    .bar {
      width: 45%;
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #6366f1, #38bdf8);
      animation: slide 1.15s ease-in-out infinite;
    }
    @keyframes slide {
      0% { transform: translateX(-110%); }
      100% { transform: translateX(250%); }
    }
    .status {
      font-size: 11.5px;
      color: #cbd5e1;
      font-family: Consolas, "Cascadia Mono", monospace;
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="./assets/nai_studio_icon.png" alt="NAI Studio" />
    <div class="title">NAI Studio</div>
    <div class="sub">Obsidian Atelier · NovelAI V5 / Agent / MCP / A2A</div>
    <div class="bar-wrap"><div class="bar"></div></div>
    <div id="status-text" class="status">正在启动本地创作引擎 (127.0.0.1:8780)...</div>
  </div>
  <script>
    if (window.naiDesktop && typeof window.naiDesktop.onSplashStatus === "function") {
      window.naiDesktop.onSplashStatus((txt) => {
        const el = document.getElementById("status-text");
        if (el && txt) el.textContent = txt;
      });
    }
  </script>
</body>
</html>
