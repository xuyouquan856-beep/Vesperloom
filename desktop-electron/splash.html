<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vesperloom</title>
<style>
  :root {
    --accent-rgb: 56, 189, 248;
    --accent-hex: #38bdf8;
    --accent2-hex: #818cf8;
    --accent-light: #bae6fd;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
    font-family: "Georgia", "Times New Roman", "Segoe UI", serif;
  }

  .splash {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 18px;
    overflow: hidden;
    background: #050811;
    box-shadow: 0 28px 80px rgba(0, 0, 0, 0.72), 0 0 0 1px rgba(var(--accent-rgb), 0.28);
    -webkit-app-region: drag;
    opacity: 1;
    transform: scale(1);
    transition: opacity 0.36s cubic-bezier(0.22, 1, 0.36, 1), transform 0.36s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .splash.is-light {
    background: #f1f5f9;
  }
  .splash.is-fading-out {
    opacity: 0;
    transform: scale(1.025);
  }

  .pre-glow {
    position: absolute;
    left: 44%;
    top: 38%;
    width: 260px;
    height: 260px;
    margin-left: -130px;
    margin-top: -130px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 255, 255, 0.9) 0%, rgba(var(--accent-rgb), 0.45) 38%, transparent 72%);
    opacity: 0;
    animation: preGlowPulse 1.45s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    pointer-events: none;
    z-index: 3;
  }
  @keyframes preGlowPulse {
    0% { transform: scale(0.12); opacity: 0; }
    24% { transform: scale(1.12); opacity: 1; }
    100% { transform: scale(3.0); opacity: 0; }
  }

  .art-layer {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    will-change: clip-path, transform, filter;
    animation: celestialReveal 1.6s cubic-bezier(0.19, 1, 0.22, 1) 0.12s both,
               kenBurnsBreath 5.2s ease-out 1.35s forwards;
  }
  @keyframes celestialReveal {
    0% {
      clip-path: circle(0% at 44% 38%);
      transform: scale(1.08);
      filter: brightness(1.42) saturate(1.16) blur(3.5px);
    }
    58% {
      filter: brightness(1.08) saturate(1.06) blur(0.3px);
    }
    100% {
      clip-path: circle(135% at 44% 38%);
      transform: scale(1.02);
      filter: brightness(1) saturate(1.02) blur(0);
    }
  }
  @keyframes kenBurnsBreath {
    from { transform: scale(1.02); }
    to { transform: scale(1.0); }
  }

  /* Dark-image subtle vignette (automatically disabled on bright/white artwork!) */
  .vignette {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 54% 42%, transparent 44%, rgba(4, 7, 15, 0.56) 100%),
                linear-gradient(180deg, transparent 62%, rgba(4, 7, 15, 0.58) 100%);
    pointer-events: none;
    z-index: 2;
    transition: opacity 0.2s ease;
  }
  .splash.is-light .vignette {
    opacity: 0;
  }
  .edge-frame {
    position: absolute;
    inset: 0;
    border-radius: 18px;
    box-shadow: inset 0 0 0 1px rgba(var(--accent-rgb), 0.26);
    pointer-events: none;
    z-index: 8;
  }

  /* Anamorphic horizontal + vertical star flare */
  .flare-wrap {
    position: absolute;
    left: 44%;
    top: 38%;
    z-index: 6;
    pointer-events: none;
  }
  .flare-h {
    position: absolute;
    left: -260px;
    top: -1.5px;
    width: 520px;
    height: 3px;
    background: linear-gradient(90deg, transparent 0%, rgba(var(--accent-rgb), 0.58) 28%, #ffffff 50%, rgba(var(--accent-rgb), 0.58) 72%, transparent 100%);
    filter: blur(0.6px);
    opacity: 0;
    transform: scaleX(0.05);
    animation: flareSweepH 1.12s cubic-bezier(0.16, 1, 0.3, 1) 0.02s forwards;
  }
  .flare-v {
    position: absolute;
    left: -1px;
    top: -92px;
    width: 2px;
    height: 184px;
    background: linear-gradient(180deg, transparent 0%, rgba(var(--accent-rgb), 0.6) 35%, #ffffff 50%, rgba(var(--accent-rgb), 0.6) 65%, transparent 100%);
    opacity: 0;
    transform: scaleY(0.08);
    animation: flareSweepV 0.92s cubic-bezier(0.16, 1, 0.3, 1) 0.02s forwards;
  }
  @keyframes flareSweepH {
    0% { transform: scaleX(0.04); opacity: 0; }
    24% { transform: scaleX(1.05); opacity: 1; }
    100% { transform: scaleX(1.45); opacity: 0; }
  }
  @keyframes flareSweepV {
    0% { transform: scaleY(0.05); opacity: 0; }
    26% { transform: scaleY(1); opacity: 0.95; }
    100% { transform: scaleY(0.2); opacity: 0; }
  }

  /* Dual Counter-Rotating Celestial SVG Rings */
  .rings-svg {
    position: absolute;
    left: 44%;
    top: 38%;
    width: 980px;
    height: 980px;
    margin-left: -490px;
    margin-top: -490px;
    z-index: 5;
    pointer-events: none;
    overflow: visible;
  }
  .ring-outer {
    transform-origin: 490px 490px;
    animation: ringExpandOuter 1.58s cubic-bezier(0.16, 1, 0.3, 1) 0.06s both;
  }
  .ring-inner {
    transform-origin: 490px 490px;
    animation: ringExpandInner 1.44s cubic-bezier(0.19, 1, 0.22, 1) 0.12s both;
  }
  .ring-echo {
    transform-origin: 490px 490px;
    animation: ringExpandEcho 1.72s cubic-bezier(0.16, 1, 0.3, 1) 0.22s both;
  }
  @keyframes ringExpandOuter {
    0% { transform: scale(0.03) rotate(-32deg); opacity: 0; }
    20% { opacity: 0.95; }
    78% { opacity: 0.52; }
    100% { transform: scale(1.16) rotate(28deg); opacity: 0; }
  }
  @keyframes ringExpandInner {
    0% { transform: scale(0.02) rotate(42deg); opacity: 0; }
    24% { opacity: 0.85; }
    100% { transform: scale(0.90) rotate(-40deg); opacity: 0; }
  }
  @keyframes ringExpandEcho {
    0% { transform: scale(0.04); opacity: 0; }
    26% { opacity: 0.45; }
    100% { transform: scale(1.30); opacity: 0; }
  }

  #shards-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 4;
    pointer-events: none;
  }

  /* Pure Adaptive Wordmark (ZERO progress bar, ZERO technical text) */
  .wordmark {
    position: absolute;
    left: 38px;
    bottom: 30px;
    z-index: 7;
    display: flex;
    align-items: center;
    gap: 10px;
    opacity: 0;
    animation: wordmarkIn 1.0s cubic-bezier(0.19, 1, 0.22, 1) 0.52s forwards;
  }
  .wordmark-star {
    width: 15px;
    height: 15px;
    filter: drop-shadow(0 0 8px rgba(var(--accent-rgb), 0.9));
    animation: starTwinkle 2.6s ease-in-out infinite;
  }
  .wordmark-text {
    font-size: 32px;
    font-weight: 400;
    letter-spacing: 0.14em;
    background: linear-gradient(105deg, #e2e8f0 0%, #ffffff 38%, var(--accent-light) 52%, #ffffff 66%, #cbd5e1 100%);
    background-size: 230% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 4px 20px rgba(4, 8, 22, 0.88)) drop-shadow(0 0 16px rgba(var(--accent-rgb), 0.3));
    animation: wordmarkShimmer 2.8s ease-in-out 0.85s infinite;
  }
  .splash.is-light .wordmark-text {
    font-weight: 500;
    background: linear-gradient(105deg, #0f172a 0%, #1e3a8a 34%, var(--accent-hex) 50%, #1e3a8a 66%, #0f172a 100%);
    background-size: 230% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.98)) drop-shadow(0 2px 10px rgba(255, 255, 255, 0.92));
  }
  @keyframes wordmarkIn {
    0% { opacity: 0; transform: translateY(10px); letter-spacing: 0.22em; }
    100% { opacity: 1; transform: translateY(0); letter-spacing: 0.14em; }
  }
  @keyframes wordmarkShimmer {
    0% { background-position: 120% 0; }
    55%, 100% { background-position: -120% 0; }
  }
  @keyframes starTwinkle {
    0%, 100% { transform: scale(0.92) rotate(0deg); opacity: 0.88; }
    50% { transform: scale(1.18) rotate(12deg); opacity: 1; }
  }
</style>
</head>
<body>
  <div id="splash-root" class="splash">
    <div class="pre-glow"></div>
    <div id="art-layer" class="art-layer"></div>
    <div class="vignette"></div>
    <canvas id="shards-canvas"></canvas>

    <div class="flare-wrap">
      <div class="flare-h"></div>
      <div class="flare-v"></div>
    </div>

    <svg class="rings-svg" viewBox="0 0 980 980" fill="none">
      <defs>
        <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop id="rg-stop-1" offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
          <stop id="rg-stop-2" offset="50%" stop-color="#38bdf8" stop-opacity="0.88"/>
          <stop id="rg-stop-3" offset="100%" stop-color="#818cf8" stop-opacity="0.45"/>
        </linearGradient>
      </defs>
      <g class="ring-outer">
        <circle cx="490" cy="490" r="348" stroke="url(#ringGrad)" stroke-width="1.8"/>
        <circle id="ring-dash" cx="490" cy="490" r="365" stroke="#bae6fd" stroke-opacity="0.48" stroke-width="1.05" stroke-dasharray="4 14"/>
        <path id="ring-star-1" d="M490 130 L494.5 142 L490 154 L485.5 142 Z" fill="#ffffff"/>
        <path id="ring-star-2" d="M850 490 L838 494.5 L826 490 L838 485.5 Z" fill="#bae6fd"/>
      </g>
      <g class="ring-inner">
        <circle id="ring-in-1" cx="490" cy="490" r="252" stroke="#e0f2fe" stroke-opacity="0.72" stroke-width="1.25" stroke-dasharray="185 65 42 48"/>
        <circle id="ring-in-2" cx="490" cy="490" r="232" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="0.95" stroke-dasharray="2 10"/>
      </g>
      <circle id="ring-echo" class="ring-echo" cx="490" cy="490" r="398" stroke="#7dd3fc" stroke-opacity="0.38" stroke-width="1.1"/>
    </svg>

    <div class="wordmark">
      <svg class="wordmark-star" viewBox="0 0 24 24" fill="none">
        <path id="wm-star-path" d="M12 1.5L14.2 9.8L22.5 12L14.2 14.2L12 22.5L9.8 14.2L1.5 12L9.8 9.8L12 1.5Z" fill="#e0f2fe"/>
      </svg>
      <span class="wordmark-text">Vesperloom</span>
    </div>
    <div class="edge-frame"></div>
  </div>

<script>
(function () {
  const params = new URLSearchParams(window.location.search);
  const artSrc = params.get("art") || "./assets/default_splash.jpg";
  const artEl = document.getElementById("art-layer");
  const rootEl = document.getElementById("splash-root");

  let accent = { r: 56, g: 189, b: 248 };
  let isLightBg = false;

  function rgbToHex(r, g, b) {
    return "#" + [r, g, b].map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, "0")).join("");
  }

  function applyAdaptiveTheme(r, g, b, lightMode) {
    accent = { r, g, b };
    isLightBg = lightMode;
    const hex = rgbToHex(r, g, b);
    const lightHex = rgbToHex(Math.min(255, r + 90), Math.min(255, g + 90), Math.min(255, b + 90));
    document.documentElement.style.setProperty("--accent-rgb", `${r}, ${g}, ${b}`);
    document.documentElement.style.setProperty("--accent-hex", hex);
    document.documentElement.style.setProperty("--accent-light", lightHex);
    rootEl.classList.toggle("is-light", lightMode);

    const s1 = document.getElementById("rg-stop-1");
    const s2 = document.getElementById("rg-stop-2");
    const rd = document.getElementById("ring-dash");
    const ri1 = document.getElementById("ring-in-1");
    const ri2 = document.getElementById("ring-in-2");
    const re = document.getElementById("ring-echo");
    const rs1 = document.getElementById("ring-star-1");
    const rs2 = document.getElementById("ring-star-2");
    const wms = document.getElementById("wm-star-path");
    if (s1) s1.setAttribute("stop-color", lightMode ? hex : "#ffffff");
    if (s2) s2.setAttribute("stop-color", hex);
    if (rd) rd.setAttribute("stroke", lightMode ? hex : lightHex);
    if (ri1) ri1.setAttribute("stroke", lightMode ? hex : "#e0f2fe");
    if (ri2) ri2.setAttribute("stroke", hex);
    if (re) re.setAttribute("stroke", hex);
    if (rs1) rs1.setAttribute("fill", lightMode ? hex : "#ffffff");
    if (rs2) rs2.setAttribute("fill", lightHex);
    if (wms) wms.setAttribute("fill", lightMode ? hex : lightHex);
  }

  function analyzeArtwork(img) {
    try {
      const cv = document.createElement("canvas");
      const cw = 48, ch = 27;
      cv.width = cw; cv.height = ch;
      const ctx = cv.getContext("2d", { willReadFrequently: true });
      ctx.drawImage(img, 0, 0, cw, ch);
      const data = ctx.getImageData(0, 0, cw, ch).data;

      let blLumaSum = 0, blCount = 0;
      let totalLumaSum = 0;
      let bestScore = -1;
      let bestRgb = [56, 189, 248];

      for (let y = 0; y < ch; y++) {
        for (let x = 0; x < cw; x++) {
          const i = (y * cw + x) * 4;
          const r = data[i], g = data[i + 1], b = data[i + 2];
          const luma = 0.299 * r + 0.587 * g + 0.114 * b;
          totalLumaSum += luma;
          // Bottom-left quadrant where wordmark sits
          if (x < cw * 0.45 && y > ch * 0.62) {
            blLumaSum += luma;
            blCount++;
          }
          const maxC = Math.max(r, g, b), minC = Math.min(r, g, b);
          const sat = maxC > 0 ? (maxC - minC) / maxC : 0;
          // Prefer vibrant mid-bright hues (avoid mud & blown-out white)
          const midWeight = 1 - Math.abs(luma - 145) / 145;
          const score = sat * sat * Math.max(0.15, midWeight) * (maxC > 65 ? 1 : 0.2);
          if (score > bestScore) {
            bestScore = score;
            bestRgb = [r, g, b];
          }
        }
      }
      const avgBl = blCount ? blLumaSum / blCount : 40;
      const avgAll = totalLumaSum / (cw * ch);
      const lightMode = avgBl > 152 || avgAll > 175;
      // Gently lift overly dark accent for luminous glow
      let [ar, ag, ab] = bestRgb;
      const maxA = Math.max(ar, ag, ab, 1);
      if (bestScore < 0.08) {
        ar = 56; ag = 189; ab = 248;
      } else if (!lightMode && maxA < 190) {
        const boost = 225 / maxA;
        ar = Math.min(255, Math.round(ar * boost));
        ag = Math.min(255, Math.round(ag * boost));
        ab = Math.min(255, Math.round(ab * boost));
      }
      applyAdaptiveTheme(ar, ag, ab, lightMode);
    } catch (_) {
      applyAdaptiveTheme(56, 189, 248, false);
    }
  }

  function startShards() {
    const cv = document.getElementById("shards-canvas");
    if (!cv) return;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const w = cv.clientWidth || 740;
    const h = cv.clientHeight || 420;
    cv.width = w * dpr;
    cv.height = h * dpr;
    const ctx = cv.getContext("2d");
    ctx.scale(dpr, dpr);

    const pts = Array.from({ length: 30 }, () => ({
      x: Math.random() * w,
      y: Math.random() * h,
      vx: 0.20 + Math.random() * 0.42,
      vy: -0.13 - Math.random() * 0.28,
      size: 1.6 + Math.random() * 3.5,
      rot: Math.random() * Math.PI,
      vrot: (Math.random() - 0.5) * 0.024,
      phase: Math.random() * Math.PI * 2,
      isShard: Math.random() > 0.4,
    }));

    const t0 = performance.now();
    function tick(now) {
      const elapsed = (now - t0) / 1000;
      const masterAlpha = Math.min(1, Math.max(0, (elapsed - 0.28) / 0.75));
      ctx.clearRect(0, 0, w, h);
      const hex = rgbToHex(accent.r, accent.g, accent.b);
      const softHex = rgbToHex(Math.min(255, accent.r + 80), Math.min(255, accent.g + 80), Math.min(255, accent.b + 80));
      for (const p of pts) {
        p.x += p.vx;
        p.y += p.vy;
        p.rot += p.vrot;
        if (p.x > w + 22) p.x = -12;
        if (p.y < -22) p.y = h + 12;
        const tw = 0.35 + 0.65 * Math.abs(Math.sin(elapsed * 1.9 + p.phase));
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.globalAlpha = masterAlpha * tw * (p.isShard ? 0.75 : 0.58);
        if (p.isShard) {
          ctx.fillStyle = isLightBg ? hex : softHex;
          ctx.shadowColor = hex;
          ctx.shadowBlur = 10;
          ctx.beginPath();
          ctx.moveTo(0, -p.size * 1.45);
          ctx.lineTo(p.size * 0.68, 0);
          ctx.lineTo(0, p.size * 1.45);
          ctx.lineTo(-p.size * 0.68, 0);
          ctx.closePath();
          ctx.fill();
        } else {
          ctx.fillStyle = isLightBg ? hex : "#ffffff";
          ctx.shadowColor = hex;
          ctx.shadowBlur = 7;
          ctx.beginPath();
          ctx.arc(0, 0, p.size * 0.52, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }

  // Load chosen artwork, run adaptive palette analysis, then render
  const loader = new Image();
  loader.crossOrigin = "anonymous";
  loader.onload = () => {
    artEl.style.backgroundImage = `url("${artSrc}")`;
    analyzeArtwork(loader);
    startShards();
  };
  loader.onerror = () => {
    artEl.style.backgroundImage = `url("./assets/default_splash.jpg")`;
    startShards();
  };
  loader.src = artSrc;

  // Listen for smooth fade-out signal from Electron main process
  if (window.naiDesktop && typeof window.naiDesktop.onSplashStatus === "function") {
    window.naiDesktop.onSplashStatus((sig) => {
      if (sig === "__FADE_OUT__") rootEl.classList.add("is-fading-out");
    });
  }
})();
</script>
</body>
</html>
