<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vesperloom</title>
<style>
  :root {
    --accent-rgb: 56, 189, 248;
    --accent-hex: #38bdf8;
    --accent-light: #bae6fd;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
    font-family: "Georgia", "Times New Roman", "Segoe UI", serif;
  }

  /* Full-bleed single-window splash stage (matches exact main window aspect ratio!) */
  .splash {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #060911;
    -webkit-app-region: drag;
    opacity: 1;
    transform: translateZ(0);
    will-change: opacity, transform;
    transition: opacity 0.42s cubic-bezier(0.22, 1, 0.36, 1), transform 0.42s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .splash.is-light {
    background: #f1f5f9;
  }
  .splash.is-fading-out {
    opacity: 0;
    transform: scale(1.02) translateZ(0);
    pointer-events: none;
  }

  /* Pure GPU-composited Artwork Layer (NO blur, NO clip-path animation!) */
  .art-layer {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    opacity: 0;
    transform: scale(1.06) translateZ(0);
    will-change: transform, opacity;
    animation: artEnterGpu 1.55s cubic-bezier(0.16, 1, 0.3, 1) 0.08s forwards;
  }
  @keyframes artEnterGpu {
    0% { opacity: 0; transform: scale(1.06) translateZ(0); }
    40% { opacity: 1; }
    100% { opacity: 1; transform: scale(1.0) translateZ(0); }
  }

  /* Pure GPU Aperture Iris Veil: radial curtain expanding via transform:scale ONLY */
  .iris-veil {
    position: absolute;
    left: 50%;
    top: 44%;
    width: 120vmax;
    height: 120vmax;
    margin-left: -60vmax;
    margin-top: -60vmax;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(var(--accent-rgb), 0.38) 0%, rgba(255, 255, 255, 0.16) 18%, transparent 52%);
    opacity: 0;
    transform: scale(0.06) translateZ(0);
    will-change: transform, opacity;
    animation: irisBloomGpu 1.35s cubic-bezier(0.16, 1, 0.3, 1) 0.04s forwards;
    pointer-events: none;
    z-index: 3;
  }
  @keyframes irisBloomGpu {
    0% { transform: scale(0.06) translateZ(0); opacity: 0; }
    24% { opacity: 0.95; }
    100% { transform: scale(1.45) translateZ(0); opacity: 0; }
  }

  /* Subtle dark-mode edge vignette (auto-hidden on bright/white artwork) */
  .vignette {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 52% 44%, transparent 45%, rgba(4, 7, 15, 0.56) 100%),
                linear-gradient(180deg, transparent 62%, rgba(4, 7, 15, 0.62) 100%);
    pointer-events: none;
    z-index: 2;
  }
  .splash.is-light .vignette {
    opacity: 0;
  }

  /* Pure GPU Anamorphic Star Flare (transform + opacity only) */
  .flare-wrap {
    position: absolute;
    left: 50%;
    top: 44%;
    z-index: 6;
    pointer-events: none;
  }
  .flare-h {
    position: absolute;
    left: -340px;
    top: -1.5px;
    width: 680px;
    height: 3px;
    background: linear-gradient(90deg, transparent 0%, rgba(var(--accent-rgb), 0.6) 28%, #ffffff 50%, rgba(var(--accent-rgb), 0.6) 72%, transparent 100%);
    opacity: 0;
    transform: scaleX(0.04) translateZ(0);
    will-change: transform, opacity;
    animation: flareH 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0.02s forwards;
  }
  .flare-v {
    position: absolute;
    left: -1px;
    top: -110px;
    width: 2px;
    height: 220px;
    background: linear-gradient(180deg, transparent 0%, rgba(var(--accent-rgb), 0.6) 35%, #ffffff 50%, rgba(var(--accent-rgb), 0.6) 65%, transparent 100%);
    opacity: 0;
    transform: scaleY(0.06) translateZ(0);
    will-change: transform, opacity;
    animation: flareV 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.02s forwards;
  }
  @keyframes flareH {
    0% { transform: scaleX(0.04) translateZ(0); opacity: 0; }
    24% { transform: scaleX(1.04) translateZ(0); opacity: 1; }
    100% { transform: scaleX(1.45) translateZ(0); opacity: 0; }
  }
  @keyframes flareV {
    0% { transform: scaleY(0.06) translateZ(0); opacity: 0; }
    26% { transform: scaleY(1) translateZ(0); opacity: 0.95; }
    100% { transform: scaleY(0.18) translateZ(0); opacity: 0; }
  }

  /* Pure GPU Dual Counter-Rotating Celestial Rings */
  .rings-svg {
    position: absolute;
    left: 50%;
    top: 44%;
    width: 960px;
    height: 960px;
    margin-left: -480px;
    margin-top: -480px;
    z-index: 5;
    pointer-events: none;
    overflow: visible;
  }
  .ring-outer {
    transform-origin: 480px 480px;
    will-change: transform, opacity;
    animation: ringOut 1.5s cubic-bezier(0.16, 1, 0.3, 1) 0.05s both;
  }
  .ring-inner {
    transform-origin: 480px 480px;
    will-change: transform, opacity;
    animation: ringIn 1.38s cubic-bezier(0.19, 1, 0.22, 1) 0.1s both;
  }
  @keyframes ringOut {
    0% { transform: scale(0.04) rotate(-30deg); opacity: 0; }
    20% { opacity: 0.92; }
    78% { opacity: 0.45; }
    100% { transform: scale(1.25) rotate(26deg); opacity: 0; }
  }
  @keyframes ringIn {
    0% { transform: scale(0.03) rotate(40deg); opacity: 0; }
    24% { opacity: 0.82; }
    100% { transform: scale(0.95) rotate(-38deg); opacity: 0; }
  }

  /* Ultra-lightweight Zero-ShadowBlur 60fps Shards Canvas */
  #shards-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 4;
    pointer-events: none;
  }

  /* Pure Adaptive Wordmark (ZERO progress bar, ZERO technical text) */
  .wordmark {
    position: absolute;
    left: 48px;
    bottom: 42px;
    z-index: 7;
    display: flex;
    align-items: center;
    gap: 11px;
    opacity: 0;
    transform: translateY(10px) translateZ(0);
    will-change: transform, opacity;
    animation: wordmarkIn 0.85s cubic-bezier(0.19, 1, 0.22, 1) 0.38s forwards;
  }
  .wordmark-star {
    width: 16px;
    height: 16px;
    will-change: transform, opacity;
    animation: starTwinkle 2.4s ease-in-out infinite;
  }
  .wordmark-text {
    font-size: 38px;
    font-weight: 400;
    letter-spacing: 0.15em;
    color: #f8fafc;
    text-shadow: 0 4px 24px rgba(4, 8, 22, 0.85), 0 0 22px rgba(var(--accent-rgb), 0.38);
  }
  .splash.is-light .wordmark-text {
    font-weight: 500;
    color: #0f172a;
    text-shadow: 0 0 18px rgba(255, 255, 255, 0.98), 0 2px 12px rgba(255, 255, 255, 0.95);
  }
  @keyframes wordmarkIn {
    0% { opacity: 0; transform: translateY(10px) translateZ(0); }
    100% { opacity: 1; transform: translateY(0) translateZ(0); }
  }
  @keyframes starTwinkle {
    0%, 100% { transform: scale(0.92) rotate(0deg); opacity: 0.88; }
    50% { transform: scale(1.16) rotate(12deg); opacity: 1; }
  }
</style>
</head>
<body>
  <div id="splash-root" class="splash">
    <div id="art-layer" class="art-layer"></div>
    <div class="vignette"></div>
    <div class="iris-veil"></div>
    <canvas id="shards-canvas"></canvas>

    <div class="flare-wrap">
      <div class="flare-h"></div>
      <div class="flare-v"></div>
    </div>

    <svg class="rings-svg" viewBox="0 0 960 960" fill="none">
      <defs>
        <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop id="rg-stop-1" offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
          <stop id="rg-stop-2" offset="50%" stop-color="#38bdf8" stop-opacity="0.88"/>
          <stop id="rg-stop-3" offset="100%" stop-color="#818cf8" stop-opacity="0.4"/>
        </linearGradient>
      </defs>
      <g class="ring-outer">
        <circle cx="480" cy="480" r="340" stroke="url(#ringGrad)" stroke-width="1.8"/>
        <circle id="ring-dash" cx="480" cy="480" r="358" stroke="#bae6fd" stroke-opacity="0.45" stroke-width="1" stroke-dasharray="4 14"/>
        <path id="ring-star-1" d="M480 128 L484.5 140 L480 152 L475.5 140 Z" fill="#ffffff"/>
        <path id="ring-star-2" d="M832 480 L820 484.5 L808 480 L820 475.5 Z" fill="#bae6fd"/>
      </g>
      <g class="ring-inner">
        <circle id="ring-in-1" cx="480" cy="480" r="245" stroke="#e0f2fe" stroke-opacity="0.72" stroke-width="1.25" stroke-dasharray="180 65 40 48"/>
        <circle id="ring-in-2" cx="480" cy="480" r="226" stroke="#38bdf8" stroke-opacity="0.38" stroke-width="0.95" stroke-dasharray="2 10"/>
      </g>
    </svg>

    <div class="wordmark">
      <svg class="wordmark-star" viewBox="0 0 24 24" fill="none">
        <path id="wm-star-path" d="M12 1.5L14.2 9.8L22.5 12L14.2 14.2L12 22.5L9.8 14.2L1.5 12L9.8 9.8L12 1.5Z" fill="#bae6fd"/>
      </svg>
      <span class="wordmark-text">Vesperloom</span>
    </div>
  </div>

<script>
(function () {
  const params = new URLSearchParams(window.location.search);
  const artSrc = params.get("art") || "./assets/default_splash.jpg";
  const artEl = document.getElementById("art-layer");
  const rootEl = document.getElementById("splash-root");

  let accent = { r: 56, g: 189, b: 248 };
  let isLightBg = false;
  let stopped = false;

  function rgbToHex(r, g, b) {
    return "#" + [r, g, b].map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, "0")).join("");
  }

  function applyAdaptiveTheme(r, g, b, lightMode) {
    accent = { r, g, b };
    isLightBg = lightMode;
    const hex = rgbToHex(r, g, b);
    const lightHex = rgbToHex(Math.min(255, r + 90), Math.min(255, g + 90), Math.min(255, b + 90));
    document.documentElement.style.setProperty("--accent-rgb", `${r}, ${g}, ${b}`);
    document.documentElement.style.setProperty("--accent-hex", hex);
    document.documentElement.style.setProperty("--accent-light", lightHex);
    rootEl.classList.toggle("is-light", lightMode);

    const s1 = document.getElementById("rg-stop-1");
    const s2 = document.getElementById("rg-stop-2");
    const rd = document.getElementById("ring-dash");
    const ri1 = document.getElementById("ring-in-1");
    const ri2 = document.getElementById("ring-in-2");
    const rs1 = document.getElementById("ring-star-1");
    const rs2 = document.getElementById("ring-star-2");
    const wms = document.getElementById("wm-star-path");
    if (s1) s1.setAttribute("stop-color", lightMode ? hex : "#ffffff");
    if (s2) s2.setAttribute("stop-color", hex);
    if (rd) rd.setAttribute("stroke", lightMode ? hex : lightHex);
    if (ri1) ri1.setAttribute("stroke", lightMode ? hex : "#e0f2fe");
    if (ri2) ri2.setAttribute("stroke", hex);
    if (rs1) rs1.setAttribute("fill", lightMode ? hex : "#ffffff");
    if (rs2) rs2.setAttribute("fill", lightHex);
    if (wms) wms.setAttribute("fill", lightMode ? hex : lightHex);
  }

  function analyzeArtwork(img) {
    try {
      const cv = document.createElement("canvas");
      const cw = 32, ch = 18;
      cv.width = cw; cv.height = ch;
      const ctx = cv.getContext("2d", { willReadFrequently: true });
      ctx.drawImage(img, 0, 0, cw, ch);
      const data = ctx.getImageData(0, 0, cw, ch).data;

      let blLumaSum = 0, blCount = 0, totalLumaSum = 0;
      let bestScore = -1, bestRgb = [56, 189, 248];
      for (let y = 0; y < ch; y++) {
        for (let x = 0; x < cw; x++) {
          const i = (y * cw + x) * 4;
          const r = data[i], g = data[i + 1], b = data[i + 2];
          const luma = 0.299 * r + 0.587 * g + 0.114 * b;
          totalLumaSum += luma;
          if (x < cw * 0.45 && y > ch * 0.62) { blLumaSum += luma; blCount++; }
          const maxC = Math.max(r, g, b), minC = Math.min(r, g, b);
          const sat = maxC > 0 ? (maxC - minC) / maxC : 0;
          const midWeight = 1 - Math.abs(luma - 145) / 145;
          const score = sat * sat * Math.max(0.15, midWeight) * (maxC > 65 ? 1 : 0.2);
          if (score > bestScore) { bestScore = score; bestRgb = [r, g, b]; }
        }
      }
      const avgBl = blCount ? blLumaSum / blCount : 40;
      const avgAll = totalLumaSum / (cw * ch);
      const lightMode = avgBl > 152 || avgAll > 175;
      let [ar, ag, ab] = bestRgb;
      const maxA = Math.max(ar, ag, ab, 1);
      if (bestScore < 0.08) { ar = 56; ag = 189; ab = 248; }
      else if (!lightMode && maxA < 190) {
        const boost = 225 / maxA;
        ar = Math.min(255, Math.round(ar * boost));
        ag = Math.min(255, Math.round(ag * boost));
        ab = Math.min(255, Math.round(ab * boost));
      }
      applyAdaptiveTheme(ar, ag, ab, lightMode);
    } catch (_) {
      applyAdaptiveTheme(56, 189, 248, false);
    }
  }

  function startShards() {
    const cv = document.getElementById("shards-canvas");
    if (!cv) return;
    const w = cv.clientWidth || window.innerWidth || 1280;
    const h = cv.clientHeight || window.innerHeight || 800;
    cv.width = w;
    cv.height = h;
    const ctx = cv.getContext("2d");

    // Zero shadowBlur — ultra-fast 60fps pure fill diamond shards & soft rings
    const pts = Array.from({ length: 24 }, () => ({
      x: Math.random() * w,
      y: Math.random() * h,
      vx: 0.25 + Math.random() * 0.45,
      vy: -0.15 - Math.random() * 0.30,
      size: 2.0 + Math.random() * 4.0,
      rot: Math.random() * Math.PI,
      vrot: (Math.random() - 0.5) * 0.02,
      phase: Math.random() * Math.PI * 2,
      isShard: Math.random() > 0.38,
    }));

    const t0 = performance.now();
    function tick(now) {
      if (stopped) return;
      const elapsed = (now - t0) / 1000;
      const masterAlpha = Math.min(1, Math.max(0, (elapsed - 0.22) / 0.6));
      ctx.clearRect(0, 0, w, h);
      const hex = rgbToHex(accent.r, accent.g, accent.b);
      const softHex = rgbToHex(Math.min(255, accent.r + 85), Math.min(255, accent.g + 85), Math.min(255, accent.b + 85));
      for (const p of pts) {
        p.x += p.vx;
        p.y += p.vy;
        p.rot += p.vrot;
        if (p.x > w + 24) p.x = -12;
        if (p.y < -24) p.y = h + 12;
        const tw = 0.38 + 0.62 * Math.abs(Math.sin(elapsed * 1.8 + p.phase));
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        if (p.isShard) {
          // Soft outer halo without expensive shadowBlur
          ctx.globalAlpha = masterAlpha * tw * 0.22;
          ctx.fillStyle = hex;
          ctx.beginPath();
          ctx.arc(0, 0, p.size * 2.1, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalAlpha = masterAlpha * tw * 0.82;
          ctx.fillStyle = isLightBg ? hex : softHex;
          ctx.beginPath();
          ctx.moveTo(0, -p.size * 1.45);
          ctx.lineTo(p.size * 0.65, 0);
          ctx.lineTo(0, p.size * 1.45);
          ctx.lineTo(-p.size * 0.65, 0);
          ctx.closePath();
          ctx.fill();
        } else {
          ctx.globalAlpha = masterAlpha * tw * 0.65;
          ctx.fillStyle = isLightBg ? hex : "#ffffff";
          ctx.beginPath();
          ctx.arc(0, 0, p.size * 0.55, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }

  const loader = new Image();
  loader.crossOrigin = "anonymous";
  loader.onload = () => {
    artEl.style.backgroundImage = `url("${artSrc}")`;
    analyzeArtwork(loader);
    startShards();
  };
  loader.onerror = () => {
    artEl.style.backgroundImage = `url("./assets/default_splash.jpg")`;
    startShards();
  };
  loader.src = artSrc;

  if (window.naiDesktop && typeof window.naiDesktop.onSplashStatus === "function") {
    window.naiDesktop.onSplashStatus((sig) => {
      if (sig === "__FADE_OUT__") {
        stopped = true;
        rootEl.classList.add("is-fading-out");
      }
    });
  }
})();
</script>
</body>
</html>
